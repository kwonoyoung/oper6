<body>
<main class="app">

</main><input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac" multiple hidden><audio id="audio" preload="metadata"></audio>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), audio=$('#audio'), tracksEl=$('#tracks'), seek=$('#seek'), input=$('#fileInput');
const BASE_TRACKS=[{"id":"github-1","name":"급여쌤이 최고야 1","origin":"online","url":"https://kwonoyoung.github.io/oper6/audio/salary1.mp3"},{"id":"github-2","name":"급여쌤이 최고야 2","origin":"online","url":"https://kwonoyoung.github.io/oper6/audio/salary2.mp3"},{"id":"dayoff-mrk503.mp3","name":"오십춘기 권오영","origin":"dayoff","url":"https://kwonoyoung.github.io/oper6/audio/mrk503.mp3"},{"id":"dayoff-mrk501.mp3","name":"삼시 세끼","origin":"dayoff","url":"https://kwonoyoung.github.io/oper6/audio/mrk501.mp3"},{"id":"dayoff-mrk502.mp3","name":"오늘도 간다","origin":"dayoff","url":"https://kwonoyoung.github.io/oper6/audio/mrk502.mp3"},{"id":"dayoff-mrk504.mp3","name":"슈퍼 아저씨","origin":"dayoff","url":"https://kwonoyoung.github.io/oper6/audio/mrk504.mp3"}];
let extras=[], songs=[], currentId=null, shuffle=false, repeat='all', db=null, currentUrl=null, playToken=0;
const fmt=t=>Number.isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00';
const safeName=n=>n.replace(/\.[^.]+$/,'').replace(/_/g,' ');
function allSongs(){songs=[...BASE_TRACKS,...extras]}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('50-music-playlist-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbAction(type,value){return new Promise((resolve,reject)=>{if(!db)return resolve();const q=db.transaction('songs',type==='getAll'?'readonly':'readwrite').objectStore('songs')[type](...(type==='clear'||type==='getAll'?[]:[value]));q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function notify(message){$('#artist').textContent=message}
function updatePlay(){let playing=!audio.paused;$('#play').textContent=playing?'Ⅱ':'▶';$('#play').setAttribute('aria-label',playing?'일시정지':'재생');$('#cover').classList.toggle('playing',playing)}
function loadSong(s,auto=true){if(!s)return;playToken++;audio.pause();if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}currentId=s.id;
 if(s.file){currentUrl=URL.createObjectURL(s.file);audio.src=currentUrl}else{audio.src=s.url}
 audio.load();$('#title').textContent=s.name;$('#artist').textContent=s.origin==='dayoff'?'2027 DAY OFF · 온라인 스트리밍':s.origin==='online'?'오춘기 권오영 · 온라인 스트리밍':'직접 추가한 음악';seek.value=0;$('#current').textContent='0:00';$('#duration').textContent='0:00';updatePlay();render();if(auto)tryPlay()}
function tryPlay(){let token=playToken;audio.play().catch(e=>{if(token!==playToken)return;updatePlay();notify('재생할 수 없습니다. 온라인 곡은 인터넷 연결 및 원본 음원 주소를 확인해 주세요.');console.warn(e)})}
function reset(){playToken++;audio.pause();audio.removeAttribute('src');audio.load();if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=null;currentId=null;$('#title').textContent='노래를 선택해 주세요';notify('재생목록에서 노래를 선택해 주세요');seek.value=0;$('#current').textContent='0:00';$('#duration').textContent='0:00';updatePlay();render()}
function playIndex(i){if(!songs.length)return;loadSong(songs[(i+songs.length)%songs.length])}
function skip(dir){if(!songs.length)return;let idx=songs.findIndex(x=>x.id===currentId);if(shuffle&&songs.length>1){let n;do{n=Math.floor(Math.random()*songs.length)}while(n===idx);playIndex(n)}else{playIndex(idx+dir)}}
function render(){const q=$('#search').value.trim().toLowerCase(),filtered=songs.filter(x=>x.name.toLowerCase().includes(q));$('#count').textContent=`${songs.length}곡 · 기본 6곡 + 직접 추가 ${extras.length}곡`;tracksEl.replaceChildren();
 if(!filtered.length){let e=document.createElement('div');e.className='empty';e.textContent=q?'검색된 곡이 없습니다.':'목록이 비어 있습니다.';tracksEl.append(e);return}
 filtered.forEach(s=>{let idx=songs.findIndex(x=>x.id===s.id),row=document.createElement('div');row.className='track'+(s.id===currentId?' selected':'');let btn=document.createElement('button');btn.type='button';btn.className='track';btn.style.cssText='flex:1;min-width:0;padding:0;border:0;background:transparent';btn.setAttribute('aria-label',s.name+' 재생');let number=document.createElement('span');number.className='number';number.textContent=s.id===currentId&&!audio.paused?'♫':String(idx+1).padStart(2,'0');let thumb=document.createElement('span');thumb.className='thumb';thumb.textContent='♫';let meta=document.createElement('span');meta.className='meta';let title=document.createElement('div');title.className='tname';title.textContent=s.name;let sub=document.createElement('div');sub.className='tsub';let tag=document.createElement('span');tag.className='source-tag'+(s.origin==='dayoff'?' online':'');tag.textContent=s.origin==='dayoff'?'DAY OFF · 온라인':s.origin==='online'?'GitHub · 온라인':'내 음악';sub.append(tag);if(s.file){let size=document.createElement('span');size.textContent=(s.file.size/1024/1024).toFixed(1)+' MB';sub.append(size)}meta.append(title,sub);btn.append(number,thumb,meta);btn.onclick=()=>{if(s.id===currentId){audio.paused?tryPlay():audio.pause()}else loadSong(s)};row.append(btn);
 if(s.origin==='custom'){let rm=document.createElement('button');rm.type='button';rm.className='remove';rm.textContent='✕';rm.title=s.name+' 삭제';rm.setAttribute('aria-label',s.name+' 삭제');rm.onclick=async()=>{if(!confirm(`“${s.name}” 곡을 삭제할까요?`))return;try{await dbAction('delete',s.id)}catch(e){console.warn(e)}extras=extras.filter(x=>x.id!==s.id);allSongs();if(currentId===s.id)loadSong(songs[0],false);else render()};row.append(rm)}tracksEl.append(row)})}
async function addFiles(files){let accepted=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|flac|aac)$/i.test(f.name));if(!accepted.length){alert('음악 파일(MP3 등)을 선택해 주세요.');return}let failed=0;for(let f of accepted){let id=`user-${f.name}-${f.size}-${f.lastModified}`;if(songs.some(s=>s.id===id))continue;let s={id,name:safeName(f.name),file:f,origin:'custom',added:Date.now()};extras.push(s);try{if(db)await dbAction('put',s);else failed++}catch(e){failed++}}allSongs();render();if(failed)alert(`${failed}곡은 브라우저에 영구 저장되지 않았습니다. 현재 페이지에서는 재생할 수 있습니다.`)}
$('#addBtn').onclick=()=>input.click();input.onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('#play').onclick=()=>{if(!audio.src)loadSong(songs[0]);else audio.paused?tryPlay():audio.pause()};
$('#prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else skip(-1)};$('#next').onclick=()=>skip(1);
$('#shuffle').onclick=()=>{shuffle=!shuffle;$('#shuffle').classList.toggle('active',shuffle);$('#shuffle').setAttribute('aria-pressed',String(shuffle))};
$('#repeat').onclick=()=>{repeat=repeat==='all'?'one':repeat==='one'?'off':'all';$('#repeat').textContent=repeat==='one'?'↻₁':repeat==='off'?'↪':'↻';$('#repeat').classList.toggle('active',repeat==='one');$('#repeat').title='반복: '+(repeat==='all'?'전체':repeat==='one'?'한 곡':'끔');$('#repeat').setAttribute('aria-label',$('#repeat').title)};
$('#volume').oninput=e=>{audio.volume=Number(e.target.value)/100;$('#volumeText').textContent=e.target.value+'%'};audio.volume=.8;
audio.onplay=()=>{updatePlay();render()};audio.onpause=()=>{updatePlay();render()};audio.ontimeupdate=()=>{seek.value=audio.duration?Math.round(audio.currentTime/audio.duration*1000):0;$('#current').textContent=fmt(audio.currentTime)};audio.onloadedmetadata=()=>$('#duration').textContent=fmt(audio.duration);seek.oninput=()=>{if(audio.duration)audio.currentTime=(Number(seek.value)/1000)*audio.duration};
audio.onended=()=>{if(repeat==='one'){audio.currentTime=0;tryPlay()}else{let idx=songs.findIndex(s=>s.id===currentId);if(repeat==='off'&&!shuffle&&idx===songs.length-1){audio.pause();audio.currentTime=0}else skip(1)}};
audio.onerror=()=>{if(currentId){let s=songs.find(x=>x.id===currentId);if(s)notify(s.origin==='custom'?'음원 재생에 오류가 발생했습니다.':'온라인 음원을 불러올 수 없습니다. 인터넷 연결 또는 GitHub의 음원 파일('+s.url.split('/').pop()+')을 확인해 주세요.')}};
$('#search').oninput=render;$('#clear').onclick=async()=>{if(!extras.length){alert('기본 수록 6곡은 삭제되지 않습니다.');return}if(!confirm(`직접 추가한 ${extras.length}곡을 모두 삭제할까요? 기본 6곡은 유지됩니다.`))return;try{await dbAction('clear')}catch(e){console.warn(e)}extras=[];allSongs();if(!songs.some(s=>s.id===currentId))loadSong(songs[0],false);else render()};
const drop=$('#drop');['dragenter','dragover'].forEach(t=>$('#dropZone').addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>$('#dropZone').addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));$('#dropZone').addEventListener('drop',e=>addFiles(e.dataTransfer.files));
(async()=>{allSongs();render();loadSong(songs[0],false);try{db=await openDb();extras=(await dbAction('getAll')).sort((a,b)=>a.added-b.added).map(s=>({...s,origin:'custom'}));allSongs();render()}catch(e){console.warn('IndexedDB unavailable',e);$('#drop').textContent='추가 음악의 자동 저장은 브라우저에 따라 제한될 수 있습니다. 기본 수록곡은 언제든 재생목록에 남습니다.'}})();
